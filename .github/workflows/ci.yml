# Continuous integration: every push and PR runs the engine tests (Windows —
# the Rust side needs no system packages there) and the frontend build + UI
# tests (Ubuntu).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine tests (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Run engine tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --all-targets

  frontend:
    name: Frontend (${{ matrix.task }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck + bundle
        if: matrix.task == 'typecheck'
        working-directory: apps/desktop
        run: npm run build

      - name: UI tests (vitest)
        if: matrix.task == 'unit'
        working-directory: apps/desktop
        run: npm test
